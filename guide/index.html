<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"><!-- 재원생·학부모·직원 안내용: 검색에 노출하지 않음 -->
<title>이용 안내 | 승리자리 관리형 스터디센터</title>
<meta name="description" content="승리자리 재원생·학부모·직원을 위한 YOU승리 앱 이용 안내 영상">
<meta name="theme-color" content="#11183C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#11183C;--navy2:#24365f;--coral:#F24A69;--ink:#1f2937;--mut:#6b7280;--line:#e8ebf0}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,'Apple SD Gothic Neo',sans-serif;color:var(--ink);background:#f4f6fa}
header{background:var(--navy);color:#fff;padding:13px 18px} header a{color:#fff;text-decoration:none;font-weight:800} header small{font-weight:500;opacity:.8}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:34px 18px}
.hero .in{max-width:860px;margin:0 auto}
.eyebrow{display:inline-block;background:rgba(255,255,255,.14);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;margin:0 0 10px}
.hero h1{margin:.1em 0;font-size:27px;line-height:1.3} .hero p{margin:.5em 0 0;opacity:.85;font-size:15px}
.wrap{max-width:860px;margin:0 auto;padding:20px}
.pick{display:grid;gap:14px}
.pcard{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 2px 12px rgba(17,24,60,.05);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(17,24,60,.10)}
.pico{flex:0 0 56px;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:#eef1f8}
.pcard h2{margin:0 0 3px;font-size:19px} .pcard p{margin:0;color:var(--mut);font-size:14px}
.parr{margin-left:auto;color:var(--coral);font-weight:800;font-size:20px}
.note{margin:22px 0 0;text-align:center;color:var(--mut);font-size:13.5px}
.note a{color:var(--navy);font-weight:700}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
</style>
</head>
<body>
<header><a href="/">승리자리 <small>관리형 스터디센터</small></a></header>
<section class="hero"><div class="in">
  <span class="eyebrow">이용 안내</span>
  <h1>무엇을 보러 오셨나요?</h1>
  <p>각 영상은 1분 안팎 · 소리 없이 자막만 보셔도 따라 할 수 있어요.</p>
</div></section>
<div class="wrap">
  <div class="pick">
    <a class="pcard" href="/guide/student/">
      <span class="pico">🎒</span>
      <div><h2>학생 안내</h2><p>유승리 앱 시작하기 · 사유 제출 · 선생님과 메시지</p></div>
      <span class="parr">→</span>
    </a>
    <a class="pcard" href="/guide/parent/">
      <span class="pico">👪</span>
      <div><h2>학부모 안내</h2><p>자녀 출결·공부·벌점을 한 곳에서 보는 학부모 포털</p></div>
      <span class="parr">→</span>
    </a>
    <a class="pcard" href="/guide/staff/">
      <span class="pico">🧑‍🏫</span>
      <div><h2>직원 교육</h2><p>로그인 · 좌석표 · 정기일정 · 출결 판정 · 벌점</p></div>
      <span class="parr">→</span>
    </a>
  </div>
  <p class="note">궁금한 점은 데스크에 물어보시거나 <a href="tel:01092998255">010-9299-8255</a>로 연락 주세요.</p>
</div>
<footer>© 2026 승리자리 관리형 스터디센터 · <a href="/" style="color:var(--mut)">홈으로</a></footer>
</body>
</html>
